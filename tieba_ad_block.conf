# ============================================================
#  贴吧去广告 · Quantumult X 配置片段  v1.0 | 2026-10-28
#  依据: 用户提供的 49MB HAR 抓包(2026-10-28 19:55) + 4张广告截图
#  覆盖: 开屏5秒广告 / 首页信息流广告 / 帖子楼层间广告
# ============================================================
#
# ── 使用: 复制以下三段到 QX 配置文件对应位置(已有同名段落则合并) ──
#
# [mitm] 段: 与签到脚本的 hostname 合并成一行
# (tieba.baidu.com 是签到抓包用, tiebac.baidu.com 是广告接口域, 两者都要)
#
[mitm]
hostname = tieba.baidu.com, tiebac.baidu.com

[rewrite_local]
# ── 贴吧自有广告接口(路径级拒绝, 需要上面的 mitm) ──
# 开屏广告(启动时请求, 返回JSON)
^https?:\/\/tiebac\.baidu\.com\/c\/f\/ad\/getSplashAd url reject-dict
# 信息流广告(首页下滑卡片 + 帖子楼层间, 返回protobuf, 截图中带"广告"标识的卡片)
^https?:\/\/tiebac\.baidu\.com\/c\/f\/ad\/getFeedAd url reject-dict
# 帖子内广告竞价(进帖瞬间请求)
^https?:\/\/tiebac\.baidu\.com\/c\/b\/ad\/adBid url reject-dict
# 广告曝光/点击日志上报
^https?:\/\/tiebac\.baidu\.com\/c\/s\/adNewLog url reject
^https?:\/\/tiebac\.baidu\.com\/c\/s\/adLog url reject

[filter_local]
# ── 第三方广告SDK/素材域名(主机级拒绝, 无需mitm) ──
# 穿山甲(字节)广告SDK — 50+次请求, 开屏/信息流/视频广告主要填充源
host, api-access.pangolin-sdk-toutiao-b.com, reject
# 百度联盟广告入口/配置(开屏备用来源)
host, afd.baidu.com, reject
host, afdconf.baidu.com, reject
# 百度广告SDK配置/风控
host, mbd.baidu.com, reject
# 百度广告视频素材CDN(抓包中下载了开屏1080x1920视频, 单个786KB)
host, nadvideo2.baidu.com, reject
# 广告事件上报与素材分发
host, rpe.xdplt.com, reject
host, cd.xdplt.com, reject
# 广告聚合SDK(protobuf协议)
host, entry-su1.ubixioe.com, reject
# 字节火山广告反作弊SDK
host, mssdk.volces.com, reject
# 快手广告素材CDN与SDK
host, p66-ad.adkwai.com, reject
host, open.e.kuaishou.com, reject

# ============================================================
#  设计说明
# ============================================================
# 1. 双层拦截:
#    - rewrite_local 拒绝贴吧自己的广告接口(按URL路径匹配, HTTPS需mitm解密)
#    - filter_local 直接掐断第三方广告域名(按主机名, 无需解密)
#    两层叠加, 任一漏网都被另一层兜住。
#
# 2. 内容安全: 首页推荐/帖子内容走的是完全独立的接口
#    (/c/f/search/discover, /c/f/excellent/personalized, /c/f/pb/firstPage, /c/f/pb/page),
#    本配置全部未触碰, 只杀广告不伤内容。
#
# 3. 未屏蔽(有意保留):
#    - p3-sign.douyinpic.com / qh-material.taobao.com: 广告素材CDN, 但与抖音/淘宝
#      共用域名, 全局封禁有风险; 广告源头被拒后它们不会再被请求;
#    - feed-image.baidu.com: 联盟图片CDN, 百度系App可能用于内容图, 默认不封;
#      如仍有图片广告可补一条: host, feed-image.baidu.com, reject
#    - sofire/httpdns/tuisong/gsp/als/h2tcbox: 安全/推送/日志服务, 非广告显示链路;
#    - shopGoodsFeed(贴吧好物商城): 如还想屏蔽首页"好物商品卡片", 加:
#      ^https?:\/\/tieba\.baidu\.com\/c\/f\/forum\/shopGoodsFeed url reject-dict
#
# 4. reject-dict 返回空JSON(200), 比硬断连更温和: App视为"无广告",
#    开屏直接跳首页, 信息流不出广告卡片。
#
# 5. 验证方法: 保存配置 → 重启贴吧App(彻底杀进程) →
#    开屏应直接进首页; 首页下滑/进帖子观察广告位是否消失。
#    每个广告都不一样是正常的(广告联盟按曝光实时竞价轮换), 拦截的是接口本身,
#    与具体广告内容无关。
